<style>
:root{--in:#0b1713;--item:#0e1c17;--pre:#08110e;--trk:#0c1814;--thbg:#0f1f19;--sk1:#10201a;--sk2:#18302a;--sh1:0 1px 2px rgba(0,0,0,.25);--sh2:0 8px 24px rgba(0,0,0,.28);--sh3:0 24px 60px rgba(0,0,0,.5);--bg:#0a1411;--bg2:#0f1d18;--card:#12221c;--card2:#162a23;--line:#254036;--gold:#d8bb6c;--gold2:#f0dc9c;--txt:#f3ecd8;--mut:#9fb0a5;--ok:#5fd39a;--warn:#f0b35a;--bad:#ef6f6f;--blue:#6fb4e8;--r:18px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Cairo,Tajawal,system-ui,sans-serif;background:radial-gradient(1200px 600px at 85% -10%,#173126 0,transparent 60%),radial-gradient(900px 500px at -10% 110%,#13271f 0,transparent 55%),var(--bg);color:var(--txt);min-height:100vh;line-height:1.55}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72' viewBox='0 0 72 72'><g fill='none' stroke='%23d8bb6c' stroke-width='1'><path d='M36 4l8 20 20 8-20 8-8 20-8-20-20-8 20-8z'/><circle cx='36' cy='36' r='10'/></g></svg>")}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* shell */
.top{position:sticky;top:0;z-index:20;background:rgba(10,20,17,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#1d3a2e,#0f1d18);border:1px solid var(--gold);display:grid;place-items:center;box-shadow:0 0 22px rgba(216,187,108,.18)}
.brand b{font-family:Amiri,serif;font-size:24px;color:var(--gold2);line-height:1}
.brand small{display:block;color:var(--mut);font-size:12px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;height:40px;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--txt)}
.iconbtn:hover{border-color:var(--gold)}
.tabs{max-width:1240px;margin:auto;display:flex;gap:6px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:11px 14px;cursor:pointer;font-weight:500}
.tab.on{color:var(--gold2);border-color:var(--gold);font-weight:700}
main{max-width:1240px;margin:auto;padding:20px 18px 60px}
.demo{background:linear-gradient(90deg,#4a3a12,#2d2410);color:var(--gold2);text-align:center;font-size:13px;padding:6px}
/* cards */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(6,1fr)}
.g2{grid-template-columns:2fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.gs{grid-template-columns:1fr 1fr}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.card h3{margin:0 0 4px;font-size:16px;color:var(--gold2)}
.card .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.kpi .l{color:var(--mut);font-size:13px}.kpi .v{font-size:34px;font-weight:800;color:var(--txt);line-height:1.15;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--mut)}.kpi.hl{border-color:rgba(216,187,108,.55);box-shadow:0 0 30px rgba(216,187,108,.08) inset}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(95,211,154,.7);animation:pulse 1.8s infinite;margin-inline-end:6px}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(95,211,154,0)}100%{box-shadow:0 0 0 0 rgba(95,211,154,0)}}
.bars .row{display:grid;grid-template-columns:fit-content(140px) 1fr 44px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}
.bars .t{height:9px;border-radius:6px;background:var(--trk);overflow:hidden}.bars .t i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#9c8338,var(--gold))}
.bars .n{color:var(--mut);text-align:end;font-variant-numeric:tabular-nums}.bars .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{width:100%;height:200px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,187,108,.12)}
textarea{resize:vertical;min-height:80px}
.ltr{direction:ltr;text-align:left}
.btn{background:linear-gradient(180deg,#e4c878,#c4a24e);color:#1a1405;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(216,187,108,.2)}
.btn:hover{filter:brightness(1.06)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:transparent;border:1px solid #6b3434;color:var(--bad);box-shadow:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.seg{display:inline-flex;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--gold);color:#1a1405;font-weight:700}
/* table */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input{max-width:300px}.toolbar select{max-width:170px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:var(--thbg);color:var(--gold2);text-align:start;padding:11px 12px;font-weight:700;position:sticky;top:0;cursor:pointer;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid #1d332a;vertical-align:middle}tr:hover td{background:rgba(216,187,108,.04)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:rgba(95,211,154,.4);background:rgba(95,211,154,.08)}.pill.d1{color:var(--blue);border-color:rgba(111,180,232,.35)}.pill.off{color:var(--mut)}
.pill.warn{color:var(--warn);border-color:rgba(240,179,90,.4)}.pill.bad{color:var(--bad);border-color:rgba(239,111,111,.4)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mut);font-size:13px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;direction:ltr;unicode-bidi:embed}
/* list items */
.item{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 0;background:var(--item)}
.item .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.item .h .sp{flex:1}
.item pre{margin:10px 0 0;background:var(--pre);border:1px solid #1b3027;border-radius:10px;padding:10px;max-height:220px;overflow:auto;direction:ltr;text-align:left;font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:#cfe0d4}
.preview{background:var(--in);border:1px solid var(--line);border-radius:22px;padding:18px;max-width:340px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.preview h4{margin:0 0 8px;font-size:17px;color:var(--txt)}.preview p{margin:0 0 16px;color:var(--mut);font-size:14px;white-space:pre-wrap}.preview .acts{display:flex;justify-content:flex-end;gap:14px;color:var(--gold2);font-weight:700}
/* states */
.sk{background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 37%,var(--sk1) 63%);background-size:400% 100%;animation:sk 1.3s infinite;border-radius:10px;height:18px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{text-align:center;color:var(--mut);padding:34px 10px}.empty .e{font-size:34px;opacity:.7}
.err{background:rgba(239,111,111,.08);border:1px solid rgba(239,111,111,.4);color:#f5b3b3;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14px}
.toast{position:fixed;bottom:22px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:#1b3a2d;border:1px solid var(--gold);color:var(--gold2);padding:11px 20px;border-radius:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:100%;max-width:400px;text-align:center}
.lbox .logo{width:74px;height:74px;border-radius:22px;margin:0 auto 14px}
.lbox h1{font-family:Amiri,serif;color:var(--gold2);font-size:34px;margin:0}.lbox p{color:var(--mut);margin:4px 0 20px}
.lbox form{text-align:start}.lbox .btn{width:100%;margin-top:16px}
/* responsive */
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.gs,.row2,.row3{grid-template-columns:1fr}.kpi .v{font-size:28px}main{padding:14px 12px 60px}.iconbtn span{display:none}.brand small{display:none}
 .tw.cards table{min-width:0}.tw.cards thead{display:none}.tw.cards tr{display:block;border-top:1px solid var(--line);padding:8px 4px}.tw.cards td{display:flex;justify-content:space-between;gap:12px;border:0;padding:4px 10px}.tw.cards td::before{content:attr(data-l);color:var(--mut)}}

/* ===== v3 shell ===== */
:root{--t1:24px;--t2:20px;--t3:16px;--t4:14px;--t5:12px;--ease:cubic-bezier(.2,.7,.2,1)}
[data-theme=light]{--in:#fff;--item:#faf7ee;--pre:#f1ede0;--trk:#e9e4d3;--thbg:#f3efe2;--sk1:#ebe6d6;--sk2:#f6f2e6;--sh1:0 1px 2px rgba(60,50,20,.08);--sh2:0 8px 24px rgba(60,50,20,.1);--sh3:0 24px 60px rgba(60,50,20,.22);--bg:#f4f1e8;--bg2:#faf8f1;--card:#fff;--card2:#fcfaf4;--line:#ded6c0;--gold:#a8851f;--gold2:#6f5410;--txt:#1c2a23;--mut:#5a675f;--ok:#17805a;--warn:#a85f00;--bad:#b83a3a;--blue:#2466a0}
[data-theme=light] body{background:radial-gradient(1100px 500px at 85% -10%,#efe6c8 0,transparent 60%),var(--bg)}
[data-theme=light] body::before{opacity:.035}
[data-theme=light] .side{background:#fff}[data-theme=light] .top2{background:rgba(244,241,232,.85)}
[data-theme=light] .cmd .box{background:#fff}[data-theme=light] .drawer{background:#fff}
body{font-size:var(--t4)}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 12px;background:linear-gradient(180deg,#0d1a15,#0a1411);border-inline-end:1px solid var(--line)}
.side .brand{flex:none;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side nav{display:flex;flex-direction:column;gap:4px;flex:1}
.tab{display:flex;align-items:center;gap:11px;border:0;border-radius:12px;padding:11px 12px;color:var(--mut);background:none;cursor:pointer;font-weight:600;font-size:var(--t4);transition:background .18s var(--ease),color .18s var(--ease);text-align:start;border-bottom:0}
.tab svg{flex:none;opacity:.85}
.tab:hover{background:rgba(216,187,108,.07);color:var(--txt)}
.tab.on{background:linear-gradient(90deg,rgba(216,187,108,.16),rgba(216,187,108,.05));color:var(--gold2);box-shadow:inset 3px 0 0 var(--gold);border-color:transparent}
[dir=rtl] .tab.on{box-shadow:inset -3px 0 0 var(--gold)}
.tab:focus-visible,.iconbtn:focus-visible,.btn:focus-visible,th:focus-visible,tr[data-i]:focus-visible,.seg button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sidefoot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:var(--t5);color:var(--mut)}
.content{min-width:0}
.top2{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:14px 26px;background:rgba(10,20,17,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top2 h1{margin:0;font-size:var(--t2);font-weight:800;color:var(--txt);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top2 .hint{margin:0;white-space:nowrap}
.cmdk{min-width:230px;justify-content:space-between;color:var(--mut)}
kbd{font-family:inherit;direction:ltr;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--mut);background:var(--in)}
main{max-width:1280px;padding:24px 26px 80px}
.card{box-shadow:var(--sh1);transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
.card:hover{box-shadow:var(--sh2)}
.card h3{font-size:var(--t3);font-weight:700}
.card .sub{font-size:var(--t5)}
.kpis{grid-template-columns:repeat(3,1fr)}@media(min-width:1280px){.kpis{grid-template-columns:repeat(6,1fr)}}@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{display:flex;flex-direction:column;gap:2px;animation:rise .35s var(--ease) backwards}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}.kpi:nth-child(5){animation-delay:.16s}.kpi:nth-child(6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kpi .v{font-size:32px;direction:ltr;text-align:start;unicode-bidi:isolate}
.kpi .delta{display:inline-flex;align-items:center;gap:4px;font-size:var(--t5);font-weight:700;direction:ltr}
.delta.up{color:var(--ok)}.delta.down{color:var(--bad)}.delta.flat{color:var(--mut)}
.spark{width:100%;height:34px;margin-top:8px;display:block}
.spark path.l{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len,400);stroke-dashoffset:var(--len,400);animation:draw .9s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tw{max-height:70vh;overflow:auto;box-shadow:var(--sh1)}
th{z-index:2;box-shadow:0 1px 0 var(--line)}
tr[data-i]{cursor:pointer;transition:background .15s}
tr[data-i]:hover td{background:rgba(216,187,108,.07)}
body.dense td{padding:5px 12px}body.dense table{font-size:13px}
bdi,.mono{unicode-bidi:isolate}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;transition:opacity .2s var(--ease)}
.scrim.on{opacity:1}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100vw);background:var(--card);border-inline-start:1px solid var(--line);z-index:61;box-shadow:var(--sh3);transform:translateX(-100%);transition:transform .25s var(--ease);display:flex;flex-direction:column}
[dir=rtl] .drawer{transform:translateX(-102%)}
.drawer.on,[dir=rtl] .drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:var(--t3);flex:1}
.drawer .body{padding:16px 18px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;font-size:var(--t4)}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}

/* command palette */
.cmd{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.cmd .box{width:min(560px,92vw);background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh3);overflow:hidden;animation:rise .18s var(--ease)}
.cmd input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:var(--t3);background:transparent}
.cmd input:focus{box-shadow:none}
.cmd ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmd li{padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.cmd li.on,.cmd li:hover{background:rgba(216,187,108,.12)}
.cmd li small{color:var(--mut);margin-inline-start:auto;direction:ltr}
.ttip{position:fixed;z-index:80;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:var(--t5);box-shadow:var(--sh2);opacity:0;transition:opacity .12s}
.ttip.on{opacity:1}
@media(max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;inset-inline:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:6px 6px max(6px,env(safe-area-inset-bottom));z-index:30;border-inline-end:0;border-top:1px solid var(--line);background:rgba(10,20,17,.94);backdrop-filter:blur(14px)}
 [data-theme=light] .side{background:rgba(255,255,255,.94)}
 .side .brand,.sidefoot{display:none}.side nav{flex-direction:row;gap:2px;justify-content:space-around}
 .tab{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;flex:1;align-items:center;text-align:center;border-radius:10px}
 [dir=rtl] .tab.on{box-shadow:none}.tab.on{box-shadow:none}
 .top2{padding:12px 14px}.cmdk{min-width:0}.cmdk span,.cmdk kbd{display:none}
 main{padding:16px 12px 100px}
}
html.still *,html.still *::before,html.still *::after{animation:none!important;transition:none!important}html.still .spark path.l{stroke-dashoffset:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spark path.l{stroke-dashoffset:0}}
@font-face{font-family:"Twemoji Country Flags";unicode-range:U+1F1E6-1F1FF,U+1F3F4,U+E0062-E007F;src:url("https://cdn.jsdelivr.net/npm/country-flag-emoji-polyfill@0.1.8/dist/TwemojiCountryFlags.woff2") format("woff2");font-display:swap}
.flag{font-family:"Twemoji Country Flags","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-size:17px;line-height:1;margin-inline-end:6px;vertical-align:-2px}
.cc{font-size:11px;color:var(--mut);direction:ltr;unicode-bidi:isolate;margin-inline-start:6px;border:1px solid var(--line);border-radius:5px;padding:0 4px}

/* ===== polish layer: touch, type, depth, motion ===== */
:root{--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease2:cubic-bezier(.2,.8,.2,1)}
html.app{--bg:#070d14;--bg2:#0b1420;--card:#0d1824;--card2:#112030;--line:#1c2e40;--in:#09121c;--item:#0b1622;--pre:#060c13;--trk:#0a141e;--thbg:#0c1926;--sk1:#0d1824;--sk2:#16283a;--gold:#4fd1c5;--gold2:#9af0e6;--txt:#e8f1f7;--mut:#8aa0b2;--ok:#4ade80;--blue:#7cc4ff}

async function apkInfo(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-70000);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
 if(e<0)throw 0;let n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true);
 for(let k=0;k<n;k++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
  const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
  if(name==="AndroidManifest.xml"){const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true),st=lo+30+lnl+lxl;let d=u8.subarray(st,st+cs);
   if(m===8){d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())}
   return axml(d)}
  p+=46+nl+xl+cl}throw 0}
function axml(u){const v=new DataView(u.buffer,u.byteOffset,u.byteLength);let o=8;let strs=[];let res={};
 while(o<u.length){const t=v.getUint16(o,true),hs=v.getUint16(o+2,true),sz=v.getUint32(o+4,true);
  if(t===0x0001){const cnt=v.getUint32(o+8,true),fl=v.getUint32(o+16,true),sb=v.getUint32(o+20,true),utf8=fl&256;
   for(let i=0;i<cnt;i++){let q=o+sb+v.getUint32(o+hs+i*4,true);if(utf8){let l=u[q++];if(l&128)q++;let b=u[q++];if(b&128)b=((b&127)<<8)|u[q++];strs.push(new TextDecoder().decode(u.subarray(q,q+b)))}else{let l=v.getUint16(q,true);q+=2;strs.push(new TextDecoder("utf-16le").decode(u.subarray(q,q+l*2)))}}}
  else if(t===0x0102){const ns=v.getUint32(o+16,true),nm=v.getUint32(o+20,true),ac=v.getUint16(o+28,true);if(strs[nm]==="manifest"){let a=o+36;for(let i=0;i<ac;i++,a+=20){const an=strs[v.getUint32(a+4,true)],rs=v.getUint32(a+8,true),ty=u[a+15],dt=v.getUint32(a+16,true);
     if(an==="versionCode")res.code=dt;else if(an==="versionName")res.name=rs!==0xffffffff?strs[rs]:"";else if(an==="package")res.pkg=strs[rs]}return res}}
  o+=sz}return res}

function areaChart(data){const W=640,H=200,p={l:30,r:8,t:12,b:24};const max=Math.max(3,...data.map(d=>d.n));const x=i=>p.l+i*(W-p.l-p.r)/Math.max(1,data.length-1),y=v=>p.t+(1-v/max)*(H-p.t-p.b);
 const pts=data.map((d,i)=>[x(i),y(d.n)]);const line=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
 const grid=[0,.5,1].map(f=>{const v=Math.round(max*f),yy=y(v);return`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${p.l-6}" y="${yy+4}" fill="var(--mut)" font-size="11" text-anchor="end">${v}</text>`}).join("");
 const lbl=[0,Math.floor(data.length/2),data.length-1].map(i=>`<text x="${x(i)}" y="${H-6}" fill="var(--mut)" font-size="11" text-anchor="middle">${esc(data[i].d.slice(5))}</text>`).join("");
 const bars=data.map((d,i)=>`<rect x="${x(i)-3.4}" y="${y(d.n)}" width="6.8" height="${Math.max(0,H-p.b-y(d.n))}" rx="3" fill="url(#g1)" opacity=".75"><title>${esc(d.d)}: ${d.n}</title></rect>`).join("");
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="تثبيتات جديدة يوميًا"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dc9c"/><stop offset="1" stop-color="#9c8338"/></linearGradient></defs>${grid}${bars}<path d="${line}" fill="none" stroke="#f0dc9c" stroke-width="2" stroke-linejoin="round"/>${lbl}</svg>`}
const PAL=["#d8bb6c","#5fd39a","#6fb4e8","#e08f6a","#a98be0","#8aa39a"];
function donut(items,total){let a=-Math.PI/2;const R=62,r=40,C=80;const seg=items.slice(0,6).map((it,i)=>{const f=it.n/total,b=a+f*Math.PI*2;const large=f>.5?1:0;const P=(ang,rad)=>[C+rad*Math.cos(ang),C+rad*Math.sin(ang)];const [x1,y1]=P(a,R),[x2,y2]=P(b-.0001,R),[x3,y3]=P(b-.0001,r),[x4,y4]=P(a,r);a=b;
  return f>=.9999?`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${PAL[i]}" stroke-width="${R-r}"/>`:`<path d="M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z" fill="${PAL[i]}"><title>${esc(it.v)}: ${it.n}</title></path>`}).join("");
 return`<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="توزيع الإصدارات">${seg}<text x="80" y="76" fill="var(--txt)" font-size="26" font-weight="800" text-anchor="middle">${nf(total)}</text><text x="80" y="96" fill="var(--mut)" font-size="11" text-anchor="middle">جهاز</text></svg><div class="legend" style="flex-direction:column;gap:7px;margin:0">${items.slice(0,6).map((it,i)=>`<div><i style="background:${PAL[i]}"></i><span class="mono">${esc(it.v)}</span> · ${nf(it.n)} (${Math.round(it.n/total*100)}%)</div>`).join("")}</div></div>`}
function bars(items,total){return`<div class="bars">${items.map(it=>`<div class="row"><span class="k" title="${esc(it.v)}">${esc(it.v)}</span><span class="t"><i style="width:${Math.max(3,it.n/Math.max(1,total)*100)}%"></i></span><span class="n">${nf(it.n)}</span></div>`).join("")||'<div class="empty">لا بيانات</div>'}</div>`}

async function shrinkImage(f){if(f.size>25*1048576)throw new Error("الصورة كبيرة جدًا");
 const bmp=await createImageBitmap(f);const sc=Math.min(1,1080/bmp.width);const w=Math.max(1,Math.round(bmp.width*sc)),h=Math.max(1,Math.round(bmp.height*sc));

 for(const q of [.86,.78,.7,.6,.5,.4]){const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob&&blob.size<=500*1024)return{blob,type:"image/jpeg",w,h}}
 throw new Error("تعذر تصغير الصورة إلى 500 كيلوبايت. جرّب صورة أبسط")}

 if(DEMO){v.innerHTML=`<div class="card"><h3>التحقق بخطوتين</h3><p class="hint">غير متاح في العرض التجريبي.</p></div>`;return}
 let fs=[],lv={};try{fs=((await sb.auth.mfa.listFactors()).data||{}).totp||[];lv=await aal()}catch(e){}
 const on=fs[0];
 v.innerHTML=`<div class="card"><h3>التحقق بخطوتين (TOTP)</h3><div class="sub">يحمي حساب المطور حتى لو سُرقت كلمة المرور. يعمل مع Google Authenticator أو Microsoft Authenticator أو أي تطبيق مماثل.</div>
 <p><span class="pill ${on?"ok":"bad"}">${on?"مفعّل":"غير مفعّل"}</span> <span class="hint">${on?"مستوى هذه الجلسة: "+esc(lv.currentLevel||"?"):"الحساب الآن بكلمة مرور فقط"}</span></p>
 ${on?`<div style="margin-top:12px"><button class="btn danger sm" id="mdel">إيقاف التحقق بخطوتين</button></div><p class="hint">للإيقاف لازم تكون الجلسة موثّقة بالرمز.</p>`:`<div id="men"><button class="btn" id="mst">تفعيل الآن</button><p class="hint">قبل البدء: افتح تطبيق المصادقة على جوالك. سيظهر رمز QR ومفتاح نصي، احفظ المفتاح النصي في مكان آمن لاستعادة الدخول لو ضاع الجوال.</p></div>`}</div>`;
 const del=$("#mdel");if(del)del.onclick=async()=>{if(!confirm("إيقاف التحقق بخطوتين؟ سيصبح الحساب بكلمة مرور فقط."))return;const r=await sb.auth.mfa.unenroll({factorId:on.id});if(r.error)toast("فشل: "+r.error.message);else{toast("تم الإيقاف");security()}};
 const st=$("#mst");if(st)st.onclick=async()=>{st.disabled=true;const r=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Noor Admin "+new Date().toISOString().slice(0,10)});
  if(r.error){toast("فشل: "+r.error.message);st.disabled=false;return}
  const d=r.data;$("#men").innerHTML=`<p>1) امسح الرمز بتطبيق المصادقة:</p><div style="background:#fff;padding:10px;border-radius:14px;width:max-content;max-width:100%"><img alt="QR" src="${esc(d.totp.qr_code)}" width="200" height="200"></div>
  <p>أو أدخل هذا المفتاح يدويًا (احفظه):</p><div class="mono ltr" style="word-break:break-all;padding:10px;border:1px dashed var(--line);border-radius:12px;user-select:all">${esc(d.totp.secret)}</div>
  <label for="ec">2) اكتب الرمز الحالي من التطبيق</label><input id="ec" class="ltr" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div id="eer" class="err hidden"></div>
  <div style="margin-top:14px"><button class="btn" id="ego">تأكيد وتفعيل</button></div>`;
  $("#ego").onclick=async()=>{const b=$("#ego");b.disabled=true;try{const c=await sb.auth.mfa.challenge({factorId:d.id});if(c.error)throw c.error;const vv=await sb.auth.mfa.verify({factorId:d.id,challengeId:c.data.id,code:$("#ec").value.trim()});if(vv.error)throw vv.error;toast("تم تفعيل التحقق بخطوتين");security()}catch(x){b.disabled=false;$("#eer").textContent="الرمز غير صحيح. تأكد من الوقت على جوالك وجرّب مرة أخرى.";$("#eer").classList.remove("hidden")}}}}
$("#sec").onclick=()=>{cur="security";go()};
async function boot(){
 if(DEMO){$("#demoBar").classList.remove("hidden");$("#login").classList.add("hidden");$("#app").classList.remove("hidden");go();const q=location.search;if(/open=drawer/.test(q))setTimeout(()=>document.querySelector("tr[data-i]")?.click(),700);if(/open=cmd/.test(q))setTimeout(openCmd,500);return}
 const {data:{session}}=await sb.auth.getSession();
 $("#login").classList.toggle("hidden",!!session);$("#app").classList.toggle("hidden",!session);
 if(session){const a=await aal();if(a.nextLevel==="aal2"&&a.currentLevel!=="aal2"){mfaPrompt();return}go()}
}
$("#lf").onsubmit=async e=>{e.preventDefault();const b=$("#lgo");b.disabled=true;b.textContent="جارٍ الدخول...";$("#lerr").classList.add("hidden");
 const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});b.disabled=false;b.textContent="دخول";
 if(error){$("#lerr").textContent="فشل الدخول. تأكد من البريد وكلمة المرور.";$("#lerr").classList.remove("hidden")}else boot()};
$("#out").onclick=()=>api.signOut();$("#refresh").onclick=()=>{if(window.__up&&!confirm("الرفع شغال. التحديث هيلغيه. متأكد؟"))return;go()};
if(!DEMO)sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){if(window.__up){toast("انتهت الجلسة أثناء الرفع. سجّل الدخول وأعد الرفع");return}boot()}});
boot();
try{const u=JSON.parse(localStorage.getItem("noor_up")||"null");if(u&&!window.__up){localStorage.removeItem("noor_up");setTimeout(()=>toast("آخر رفع ("+u.n+") اتقطع لأن الصفحة اتقفلت أثناءه. اختر الملف وأعد الرفع"),1200)}}catch(e){}
</script></body></html>
